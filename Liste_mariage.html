                continue;

        html += `

                {
                    method: "POST",
                    body: JSON.stringify({
                        id: id,
                        montant: montant
                    })
                }
            );
            const resultat = "Participation enregistrée, merci beaucoup !" /*await reponse.text();*/
            alert(resultat);

}
