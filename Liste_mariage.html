    <section id="Contact">
        <h2>Liste de mariage</h2>
            <div id="cadeau"></div>
    </section>

    <script>
        async function chargerCadeaux() {
            const reponse = await fetch("https://script.google.com/macros/s/AKfycby9IOmPH_89FOx6oJpxu4SiLrRhvb8BKeQGECdYXnsar-0c8oLkNmR6z7wImIKxRAnK/exec");
            const lignes = await reponse.json();
            let html = "";
                for(let i = 1; i < lignes.length; i++) {
                    const cadeau = lignes[i];
                        let progression =
                            (cadeau[3] / cadeau[2]) * 100;
                        if(cadeau[1] == "") {
                continue;
                }


        html += `
        <div class="cadeau-card">
            <div class="cadeau-titre">
                ${cadeau[1]}
            </div>
            
            <div class="cadeau-contenu">
                <div class="cadeau-image">
                    <img src="Images/${cadeau[5]}">
                </div>
                
                <div class="cadeau-infos">
                    <p>Prix total : ${cadeau[2]} €     -      Montant atteint : ${cadeau[3]} €</p>
                    <div class="barre">
                        <div class="remplissage"
                            style="width:${Math.min(progression,100)}%">
                        </div>
                    </div>
                    
                    <div class="cadeau_participation">
                        <p>Reste ${cadeau[2] - cadeau[3]}€  </p>
                    </div>
                    
                    <div class="ligne-participation">
                        <input
                            type="text"
                            placeholder="De la part de..."
                            id="nom-${cadeau[0]}"></textarea>
                    </div>    

                    <div class="ligne-participation">
                        <textarea
                            placeholder="Un petit message pour nous ?"
                            id="message-${cadeau[0]}"></textarea>
                    </div>                         
                    
                    <div class="ligne-participation">
                        <input
                            type="number"
                            min="1"
                            placeholder="Montant (€)"
                            id="montant-${cadeau[0]}">
                        <button class="button-cadeau" onclick="participer(${cadeau[0]})">
                            Je participe
                        </button> 
                    </div>
                </div>
            </div>
        </div>
        `;
        }
        document.getElementById("cadeau").innerHTML = html;
        }
        chargerCadeaux();
        async function participer(id){
            const montant = document.getElementById(`montant-${id}`).value;
            const nom = document.getElementById(`nom-${id}`).value;
            const message = document.getElementById(`message-${id}`).value;
            const reponse = await fetch("https://script.google.com/macros/s/AKfycbxx5xTz-8xPoV5lSv4qegJ1eNiukH3X2tyqApaG9MMX1sFslTkV9agCCk18lw8tC-Ux-g/exec",
                {
                    method: "POST",
                    body: JSON.stringify({
                        id: id,
                        montant: montant,
                        nom: nom,
                        message: message
                    })
                }
            );
                console.log("ID :", id);
                console.log("Nom :", nom);
                console.log("Message :", message);
                console.log("Montant :", montant);
            const resultat = "Participation enregistrée, merci beaucoup !" /*await reponse.text();*/
            alert(resultat);
            document.getElementById(`montant-${id}`).value = "";
            document.getElementById(`nom-${id}`).value = "";
            document.getElementById(`message-${id}`).value = "";
            /*chargerCadeaux();*/
}
    </script>
