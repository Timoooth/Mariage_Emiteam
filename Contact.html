<body>

<header>
    <h1>Émilie et Timothée</h1>

</header>

<nav class="menu">
    <a href="index.html">Accueil</a>

<section id="Contact">
    <h2>Confirmez votre présence</h2>
    <div class="card">
        <p>
            Pour préparer au mieux cet événement, nous avons besoin de votre réponse le plus rapidement possible !<br>
            Merci à tous !
        </p>
    </div>
</section>

<section id="rsvp">
    <div class="card">

        <form action="https://formspree.io/f/myeydvyg" method="POST">
            <input
                type="text"
                name="Nom"
                placeholder="Nom et prénom"
                required>

            <select name="Presence" required>
                <option value="" disabled selected>
                    Votre réponse
                </option>
                <option>Je serai présent(e)</option>
                <option>Je ne pourrai pas venir</option>
            </select>

            <textarea
                name="Message"
                rows="3"
                placeholder="Message aux mariés"></textarea>

            <input type="hidden" name="_captcha" value="false">

            <button type="submit">Envoyer</button>

        </form>

    </div>
</section>

<footer>
    <div class="f">
    <span class="coeur">❤️</span>Émilie et Timothée<span class="coeur">❤️</span><br>Merci de célébrer ce moment avec nous !
    </div>
</footer>

</body>
</html>
